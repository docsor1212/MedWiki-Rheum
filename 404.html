  .hot{border-top:1px solid var(--line);padding-top:22px}
  .hot .t{font-size:12.5px;color:var(--faint);letter-spacing:3px;margin-bottom:12px}
  .hot .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px}
  .hot a{font-size:14px;color:var(--navy);

  .hot a:hover{border-bottom-color:var(--accent)}
  footer{text-align:center;padding:18px 0 22px;font-size:12.5px;color:var(--faint);letter-spacing:1px}
